openapi: 3.1.0
info:
  title: Product Service API
  version: 1.0.0
  description: OpenAPI 3.1 specification for Nexus Commerce Product Catalog & Pricing Service
servers:
  - url: http://localhost:8081
    description: Direct local instance
  - url: http://localhost:8080/api/v1/products
    description: Routed via Spring Cloud Gateway
paths:
  /api/v1/products:
    post:
      summary: Create new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
  /api/v1/products/price/{sku}:
    get:
      summary: Retrieve current price for SKU
      operationId: checkPrice
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Price details returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCheckResponse'
components:
  schemas:
    ProductCreateRequest:
      type: object
      required: [sku, name, price, category]
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        category:
          type: string
    ProductResponse:
      type: object
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        price:
          type: number
        active:
          type: boolean
    PriceCheckResponse:
      type: object
      properties:
        sku:
          type: string
        price:
          type: number
        availableForPurchase:
          type: boolean
