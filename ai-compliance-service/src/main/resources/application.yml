server:
  port: 8086

spring:
  application:
    name: ai-compliance-service
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-local-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.1

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  compliance:
    docs-base-path: ${DOCS_PATH:../docs}
    # Standard microservices expected in Nexus Commerce platform
    expected-services:
      - product-service
      - inventory-service
      - order-service
      - payment-service
      - notification-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
